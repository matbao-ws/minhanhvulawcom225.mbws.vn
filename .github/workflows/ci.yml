name: CI / Staging

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl, intl, gd, zip, bcmath, exif, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl, intl, gd, zip, bcmath, exif, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Reports advisories in every package, dev tools included; never blocks.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: composer audit --locked

      # Blocks on advisories in what ships to sites. An advisory with no fix yet
      # goes in composer.json config.audit.ignore with a reason and review date.
      - name: Audit production dependencies
        run: composer audit --no-dev --locked

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      # team.py edits customers' CI files (ci-audit): its text edits are tested here.
      - name: Team script tests (Python)
        run: python3 -m unittest discover -s tests/python

      # Larastan boots the application to read models and config.
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      # Uses the committed baseline; never regenerate it here.
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  image:
    needs: [test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the image like staging does (migrations on start) against SQLite.
      - name: Smoke test (migrates and answers /up)
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e APP_ENV=production -e APP_DEBUG=false \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/var/www/html/storage/smoke.sqlite \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            -e HEALTHCHECK_PATH=/up \
            smoke:latest
          docker exec smoke sh -c 'touch /var/www/html/storage/smoke.sqlite && php artisan migrate --force'
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up >/dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:staging
          cache-from: type=gha

  # Only dev goes out automatically, and only to staging. Customer sites are
  # rolled out through the tool, never straight from main.
  deploy-staging:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Through env, not ${{ }} in the script, and without \r: a key copied on Windows carries CRLF
      # line ends, which OpenSSH rejects silently ("Permission denied (publickey)").
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # The fingerprint is public: compare it with `ssh-keygen -lf /home/deploy/.ssh/authorized_keys` on the server.
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "SSH_KEY is not a valid private key"; exit 1; }

      # The key is pinned to /opt/matbaows/deploy.sh on the server; this line is its only input.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || '22' }}" -o StrictHostKeyChecking=yes \
            "deploy@${{ secrets.SSH_HOST }}" "deploy core ${{ needs.image.outputs.tag }}"
