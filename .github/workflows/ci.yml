name: Tests

# Project repository: tests only. Core releases and the staging deploy belong to the core repo.
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, curl, intl, gd, zip, bcmath, exif, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Check extensions
        run: php artisan extension:check

      - name: Editable coverage audit
        run: php artisan client:editable-audit

      - name: Run tests
        run: php artisan test --compact
